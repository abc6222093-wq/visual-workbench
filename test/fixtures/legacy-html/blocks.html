<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><title>色块课件</title>
<style>
body{margin:0;background:#f1f5f9;font-family:Arial,sans-serif}
.slide{width:1920px;height:1080px;position:relative;background:#fffbeb;overflow:hidden}
.overlay{position:absolute;left:0;top:0;width:100%;height:100%;background:rgba(0,0,0,0.05)}
.bar{position:absolute;left:0;top:0;width:1920px;height:24px;background:#dc2626}
.card{position:absolute;left:160px;top:200px;width:600px;height:400px;background:#1e3a8a;border-radius:24px;padding:40px;box-sizing:border-box;color:#fff}
.card h3{margin:0;font-size:48px}.card p{margin:16px 0 0;font-size:28px}
.seal{position:absolute;left:1500px;top:700px;width:200px;height:200px;border-radius:50%;background:#b91c1c;display:block}
.dot{position:absolute;left:1000px;top:200px;width:40px;height:40px;border-radius:50%;background:linear-gradient(90deg,#f59e0b,#ef4444)}
.photo{position:absolute;left:1000px;top:500px;width:300px;height:200px;background:#888888 url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACgAAAAeCAIAAADRv8uKAAAACXBIWXMAAAPoAAAD6AG1e1JrAAAAO0lEQVRIie3VwQkAMAwDsY5z+8/jYTpG+xDkHwiOdVZP5licU0+48k4pkKnMIBEWw2JYHBbDYljcVyxeuid+jOGn7ykAAAAASUVORK5CYII=) center/cover}
.wrap{position:absolute;left:1000px;top:800px;width:300px;height:100px}
.chip{display:block;width:120px;height:40px;background:#16a34a}
.ghost{display:none;width:100px;height:100px;background:#000}
.zero{position:absolute;left:0;top:0;width:0;height:0;background:#000}
.slide img{position:absolute;left:1300px;top:200px;width:200px;height:150px}
.slide h1{position:absolute;left:160px;top:120px;margin:0;font-size:96px}
</style></head><body>
<section class="slide one"><div class="overlay"></div><div class="bar"></div><div class="card"><h3>卡片标题</h3><p>卡片里的文字</p></div><span class="seal"></span><i class="dot"></i><div class="photo"></div><div class="wrap"><b class="chip"></b></div><div class="ghost"></div><div class="zero"></div><img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACgAAAAeCAIAAADRv8uKAAAACXBIWXMAAAPoAAAD6AG1e1JrAAAAO0lEQVRIie3VwQkAMAwDsY5z+8/jYTpG+xDkHwiOdVZP5licU0+48k4pkKnMIBEWw2JYHBbDYljcVyxeuid+jOGn7ykAAAAASUVORK5CYII=" alt="图片"></section>
<section class="slide two"><h1>第二页</h1></section>
</body></html>

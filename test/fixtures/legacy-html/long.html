<!doctype html>
<html><head><meta charset="utf-8"><title>一整页长文</title>
<style>
body{margin:0;background:#f8fafc;font-family:Arial,sans-serif;color:#0f172a}
.article{height:3000px;padding:120px 160px;box-sizing:border-box;position:relative}
.article h1{font-size:88px;margin:0 0 40px;animation:glow 2s ease-in-out infinite alternate}
.article p{font-size:36px;line-height:1.6;max-width:1200px}
.article .late{position:absolute;top:2400px;left:160px}
@keyframes glow{from{color:#0f172a}to{color:#2563eb}}
</style></head><body>
<div class="article"><h1>没有分页的长页面</h1><p>第一屏的一段文字。</p><p class="late">第三屏才看得到的文字。</p></div>
</body></html>

name: test

# 仓库已公开：公开仓库的 Actions 不占付费额度，推送和 PR 自动运行。
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      VW_BROWSER: chromium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # macOS and Ubuntu own the complete suite, including every new test.
      - name: Complete suite (macOS / Ubuntu)
        if: runner.os != 'Windows'
        run: npm test
      # Windows covers filesystem, configuration, launcher and real PNG/PDF browser export.
      - name: System and browser export suite (Windows)
        if: runner.os == 'Windows'
        run: node scripts/test-windows.js
      - run: npm run validate
      - run: npm run check-motion -- examples/sample-deck

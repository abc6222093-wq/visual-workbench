<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>玻璃样张</title>
    <script>
      /* =====================================================================
       * 玻璃样张 · 关键参数（都在这里调）
       *
       * 玻璃效果由开源库 LiquidGlass（ybouane/liquidglass，MIT）用 WebGL 渲染：
       * 真的把后面的背景折射、弯曲，边缘有白色亮边和轻微的色散。
       * ===================================================================== */
      window.GLASS = {
        // 通透：0 = 完全透明不加白；越大越像一层白色玻璃（叠加在「变亮」上）
        whiteness: 0.0,
        // 变亮：-0.5 ~ 0.5。默认背景本来就很亮，超过 0.02 玻璃里就会一片死白、看不见后面
        brightness: 0.0,
        // 饱和度：-1 ~ 1，玻璃里的颜色稍微浓一点，看得出在「透」
        saturation: 0.15,
        // 磨砂：0 = 完全不糊（要通透就保持 0 或很小）
        blur: 0.0,

        // 折射强度：边缘处背景被弯曲的程度（0 ~ 1）
        refraction: 0.7,
        // 玻璃厚度：越小越薄越平；太大会有凸起的果冻感
        thickness: 12,
        // 边缘色散：亮边处轻微的分色（只在最外沿，很细）
        chromAberration: 0.05,

        // 亮边强度：库自带的边缘提亮（太大整块玻璃会发白）
        edgeHighlight: 0.12,
        // 细白亮边：玻璃外沿那一圈 1px 白线的亮度（0 ~ 1，上方最亮、下方渐弱）
        rimLine: 0.95,
        // 掠射反光：越靠边越亮的程度
        fresnel: 0.6,
        // 表面高光：玻璃表面的反光点（背景很亮，开大了同样会发白）
        specular: 0.04,

        // 贴边的细投影（库自带，只在玻璃外 20px 内，开大会出现方形切边）
        contactShadow: 0.18,

        // —— 投影（照 P2）：光从左上方斜着照下来，投影是玻璃形状的「复印件」，往右下方错开 ——
        // 投影往右、往下错开多少（按玻璃短边的比例；P2 大约是 0.25 和 0.5）
        shadowShiftX: 0.22,
        shadowShiftY: 0.45,
        // 错开距离的上限（像素），大面板不会错得太远
        shadowShiftMax: 70,
        // 投影深浅（小控件）
        shadowOpacity: 0.5,
        // 大玻璃（面板、大圆）的投影深浅：大玻璃透过自己能看到投影，太深会显脏
        shadowOpacityLarge: 0.28,
        // 投影边缘的柔和程度（像素）；P2 的投影形状看得清，不要太糊
        shadowBlur: 9,
        // 投影中间变亮多少：光穿过透明玻璃会照亮投影中间，只剩边缘一圈深（0 = 实心投影）
        shadowHollow: 0.5,

        // 投影里透出的彩光：光穿过玻璃后带着颜色落在投影里
        causticStrength: 0.85,
        // 彩光往投影远端（右下）集中的程度：0 = 均匀铺满投影，1 = 只在远端一边
        causticFar: 0.5,
        // 彩光模糊程度（像素）
        causticBlur: 10,

        // 带色玻璃（「放映」按钮）的颜色浓度
        tint: 0.62,
      };
    </script>
    <style>
      :root {
        --ink: #2a2733;
        --ink-2: #5a5766;
        --ink-3: #8d8a99;
        --pink: 247, 168, 208;
        --blue: 143, 193, 255;
        --violet: 183, 162, 255;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #eef0f3;
        font-family:
          -apple-system,
          BlinkMacSystemFont,
          "SF Pro Text",
          "PingFang SC",
          "Hiragino Sans GB",
          sans-serif;
        color: var(--ink);
        -webkit-font-smoothing: antialiased;
      }

      /* 根容器：玻璃和它要折射的东西都放在这里面（库的要求：玻璃必须是根的直接子元素） */
      #root {
        position: fixed;
        inset: 0;
      }
      #root > * {
        position: absolute;
      }
      .bg {
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: 0;
      }

      /* 投影里透出的彩光：放在玻璃下面、往右下偏一点、模糊开 */
      .caustic {
        z-index: 1;
        border-radius: 999px;
        pointer-events: none;
      }

      .caustic.on-panel {
        z-index: 2;
      }

      /* 所有玻璃：只用圆形和胶囊形 */
      .glass {
        z-index: 2;
        border-radius: 999px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        font-size: 14px;
        font-weight: 600;
        color: var(--ink-2);
        user-select: none;
      }
      /* 细白亮边：一圈 1px 白线，上方最亮、往下渐弱（不带颜色） */
      .glass::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        padding: 1px;
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, var(--rim, 0.95)),
          rgba(255, 255, 255, calc(var(--rim, 0.95) * 0.35)) 55%,
          rgba(255, 255, 255, calc(var(--rim, 0.95) * 0.7))
        );
        -webkit-mask:
          linear-gradient(#000 0 0) content-box,
          linear-gradient(#000 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        pointer-events: none;
      }
      .glass.on-panel {
        z-index: 4;
      }

      /* ---- 布局（以画面中心为原点） ---- */
      #panel {
        left: calc(50% - 560px);
        top: calc(50% - 360px);
        width: 320px;
        height: 720px;
        flex-direction: column;
        justify-content: flex-start;
        padding-top: 110px;
      }
      #panel .title {
        margin-top: 14px;
        font-size: 15px;
        font-weight: 700;
        color: var(--ink);
      }
      #panel .sub {
        margin-top: 6px;
        font-size: 12px;
        font-weight: 500;
        color: var(--ink-3);
      }
      #btn-clear {
        left: calc(50% - 510px);
        top: calc(50% - 90px);
        width: 220px;
        height: 50px;
      }
      #btn-tint {
        left: calc(50% - 510px);
        top: calc(50% - 22px);
        width: 220px;
        height: 50px;
        color: #fff;
        text-shadow: 0 1px 2px rgba(90, 60, 170, 0.35);
      }
      #btn-tint .tint {
        position: absolute;
        inset: 0;
        border-radius: inherit;
        background: linear-gradient(
          110deg,
          rgba(var(--pink), 1),
          rgba(var(--violet), 1) 50%,
          rgba(var(--blue), 1)
        );
      }
      #btn-tint .label {
        position: relative;
      }
      #btn-round {
        left: calc(50% - 428px);
        top: calc(50% + 50px);
        width: 56px;
        height: 56px;
        color: var(--ink);
      }
      #field {
        left: calc(50% - 525px);
        top: calc(50% + 130px);
        width: 250px;
        height: 50px;
        justify-content: space-between;
        padding: 0 22px;
        font-weight: 500;
        color: var(--ink-3);
      }
      #field b {
        color: var(--ink);
        font-weight: 650;
        font-variant-numeric: tabular-nums;
      }

      /* 右边：两块玻璃部分重叠，看重叠处的折射 */
      #lens {
        left: calc(50% - 40px);
        top: calc(50% - 300px);
        width: 320px;
        height: 320px;
      }
      #bar {
        left: calc(50% + 140px);
        top: calc(50% - 40px);
        width: 420px;
        height: 140px;
        font-size: 13px;
        color: var(--ink-3);
      }
      #dot {
        left: calc(50% + 40px);
        top: calc(50% + 170px);
        width: 150px;
        height: 150px;
      }

      .hint {
        position: fixed;
        left: 20px;
        bottom: 16px;
        z-index: 10;
        font-size: 12px;
        color: rgba(42, 39, 51, 0.55);
      }
      .hint.err {
        color: #b4407e;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <img class="bg" id="bg" alt="" />

      <!-- 投影里的彩光：画在玻璃下方的底面上（用画布画，库可以直接读取） -->
      <canvas class="caustic" id="caustic-floor"></canvas>

      <!-- 大玻璃面板（代表编辑器侧栏） -->
      <div class="glass" id="panel">
        <svg class="g-mascot is-awake has-badge" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="小兔"><defs><linearGradient id="mq-b" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f3c8e4"/><stop offset="0.5" stop-color="#cdbfff"/><stop offset="1" stop-color="#bcd9ff"/></linearGradient><clipPath id="mq-c"><circle cx="32" cy="32" r="32"/></clipPath></defs><circle cx="32" cy="32" r="32" fill="url(#mq-b)"/><g clip-path="url(#mq-c)"><g transform="translate(6.4 10) scale(0.8)"><g class="m-figure" fill="#ffffff"><rect class="m-ear" x="19.86" y="6.65" width="10" height="27" rx="5" transform="rotate(-6 24.86 29.65)"/><rect class="m-ear" x="34.14" y="9.59" width="10" height="24.06" rx="5" transform="rotate(24 39.14 29.65)"/><circle class="m-head" cx="32" cy="37" r="17"/><g class="m-eyes" fill="#6a55c8"><circle cx="24.52" cy="38.5" r="2.4"/><circle cx="39.48" cy="38.5" r="2.4"/></g></g></g></g></svg>
        <span class="title">页面</span>
        <span class="sub">3 页</span>
      </div>

      <!-- 面板上控件的彩光：落在面板上面、控件下面 -->
      <canvas class="caustic on-panel" id="caustic-panel"></canvas>

      <!-- 面板上的控件（也是玻璃，叠在面板上方，折射的是面板 + 背景） -->
      <div class="glass on-panel" id="btn-clear">存一版</div>
      <div class="glass on-panel" id="btn-tint"><span class="tint"></span><span class="label">放映</span></div>
      <div class="glass on-panel" id="btn-round" aria-label="添加">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 12h14M12 5v14" /></svg>
      </div>
      <div class="glass on-panel" id="field"><span>宽度</span><b>1920</b></div>

      <!-- 两块部分重叠的玻璃 -->
      <div class="glass" id="lens"></div>
      <div class="glass on-panel" id="bar">胶囊玻璃压在圆形玻璃上</div>
      <div class="glass" id="dot"></div>
    </div>
    <p class="hint" id="hint">正在加载玻璃效果…</p>

    <script src="glass-specimen-bg.js"></script>
    <script src="vendor/liquidglass.js"></script>
    <script>
      (async () => {
        const G = window.GLASS;
        const hint = document.getElementById("hint");
        const root = document.getElementById("root");
        const bg = document.getElementById("bg");

        // 1. 背景图（内嵌数据，双击打开也能被 WebGL 读取）
        bg.src = window.GLASS_SPECIMEN_BG || "../../web/assets/backgrounds/default.jpg";
        await bg.decode().catch(() => {});

        // 2. 每块玻璃的参数
        const base = {
          refraction: G.refraction,
          zRadius: G.thickness,
          chromAberration: G.chromAberration,
          edgeHighlight: G.edgeHighlight,
          fresnel: G.fresnel,
          specular: G.specular,
          blurAmount: G.blur,
          brightness: G.brightness + G.whiteness,
          saturation: G.saturation,
          opacity: 1,
          shadowOpacity: G.contactShadow,
          shadowSpread: 5,
          shadowOffsetY: 2,
          bevelMode: 0,
        };
        const glasses = [...document.querySelectorAll(".glass")];
        for (const el of glasses) {
          const r = el.getBoundingClientRect();
          el.dataset.config = JSON.stringify({
            ...base,
            // 胶囊 / 圆：圆角 = 短边的一半
            cornerRadius: Math.min(r.width, r.height) / 2,
          });
        }
        document.querySelector("#btn-tint .tint").style.opacity = G.tint;
        document.documentElement.style.setProperty("--rim", G.rimLine);

        // 3. 投影 + 投影里的彩光：每块玻璃在底面上落一片柔和的投影，
        //    投影里透出「光穿过玻璃」的彩色亮斑；面板上控件的落在面板上
        const dpr = window.devicePixelRatio || 1;
        function pill(ctx, x, y, w, h) {
          ctx.beginPath();
          ctx.roundRect(x, y, w, h, Math.min(w, h) / 2);
        }
        // 每块玻璃投影里透出的颜色：无色玻璃 = 粉→紫→蓝；「放映」= 粉紫
        const LIGHT = {
          "btn-tint": ["rgba(247,168,208,1)", "rgba(196,160,255,1)", "rgba(183,162,255,1)"],
        };
        const LIGHT_DEFAULT = ["rgba(247,168,208,1)", "rgba(183,162,255,1)", "rgba(143,193,255,1)"];

        function paintCaustics(canvas, ids) {
          canvas.width = innerWidth * dpr;
          canvas.height = innerHeight * dpr;
          const ctx = canvas.getContext("2d");
          ctx.scale(dpr, dpr);
          for (const id of ids) {
            const r = document.getElementById(id).getBoundingClientRect();
            const short = Math.min(r.width, r.height);
            const dx = Math.min(short * G.shadowShiftX, G.shadowShiftMax * 0.5),
              dy = Math.min(short * G.shadowShiftY, G.shadowShiftMax);
            const blur = G.shadowBlur * (short > 200 ? 2 : 1);
            const pad = blur * 3 + G.causticBlur * 3 + Math.max(dx, dy);
            const off = document.createElement("canvas");
            off.width = (r.width + pad * 2) * dpr;
            off.height = (r.height + pad * 2) * dpr;
            const o = off.getContext("2d");
            o.scale(dpr, dpr);
            const x = pad + dx,
              y = pad + dy,
              w = r.width,
              h = r.height;

            // 1) 投影：玻璃形状往右下错开
            o.filter = `blur(${blur}px)`;
            o.fillStyle = `rgba(52,46,80,${short > 200 ? G.shadowOpacityLarge : G.shadowOpacity})`;
            pill(o, x, y, w, h);
            o.fill();

            // 2) 中间被透过来的光照亮：挖掉一部分，只剩边缘一圈深
            const inset = short * 0.3;
            o.globalCompositeOperation = "destination-out";
            o.filter = `blur(${Math.max(blur, short * 0.12)}px)`;
            o.fillStyle = `rgba(0,0,0,${G.shadowHollow})`;
            pill(o, x + inset, y + inset, w - inset * 2, h - inset * 2);
            o.fill();

            // 3) 彩光：只染在投影上（source-atop），往投影远端（右下）集中
            o.globalCompositeOperation = "source-atop";
            o.filter = `blur(${G.causticBlur}px)`;
            const c = LIGHT[id] || LIGHT_DEFAULT;
            const g = o.createLinearGradient(x, y, x + w, y + h);
            g.addColorStop(0, c[0]);
            g.addColorStop(0.5, c[1]);
            g.addColorStop(1, c[2]);
            o.fillStyle = g;
            o.globalAlpha = G.causticStrength;
            const far = G.causticFar * short * 0.35;
            pill(o, x + far * 0.6, y + far, w, h);
            o.fill();

            ctx.drawImage(off, r.left - pad, r.top - pad, r.width + pad * 2, r.height + pad * 2);
          }
        }
        const paintAll = () => {
          paintCaustics(document.getElementById("caustic-floor"), ["panel", "lens", "dot"]);
          paintCaustics(document.getElementById("caustic-panel"), [
            "btn-clear",
            "btn-tint",
            "btn-round",
            "field",
            "bar",
          ]);
        };
        paintAll();

        // 4. 启动玻璃
        try {
          const instance = await LiquidGlassLib.LiquidGlass.init({ root, glassElements: glasses });
          // 窗口大小变了：重画投影和彩光，再让玻璃重新取样
          let t;
          addEventListener("resize", () => {
            clearTimeout(t);
            t = setTimeout(() => {
              paintAll();
              instance.markChanged();
            }, 120);
          });
          hint.textContent = "玻璃样张 · 参数在文件开头 window.GLASS 里调";
        } catch (err) {
          hint.textContent = "玻璃效果没能启动：" + err.message;
          hint.classList.add("err");
          console.error(err);
        }
      })();
    </script>
  </body>
</html>

<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>动效检查</title><body><script type="module">
import { checkMotion } from './motion-check.js';
addEventListener('message', async event => {
  if (event.source !== parent || !event.data || event.data.type !== 'check-motion') return;
  const id = event.data.id;
  try { parent.postMessage({ type: 'check-motion-result', id, result: await checkMotion(event.data.project, event.data.options || {}) }, event.origin); }
  catch (error) { parent.postMessage({ type: 'check-motion-result', id, error: String(error?.stack || error) }, event.origin); }
});
</script></body></html>

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>首页 · 电脑端</title>
<style>
  html, body { margin: 0; width: 1440px; }
  body { background: #fff; color: #0f172a; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
  nav { height: 80px; box-sizing: border-box; padding: 0 120px; display: flex; align-items: center; gap: 48px; background: #0f172a; color: #fff; }
  nav img { width: 40px; height: 40px; }
  nav a { color: inherit; text-decoration: none; font-size: 20px; }
  nav .brand { margin-right: auto; font-size: 24px; font-weight: 700; }
  .hero { position: relative; height: 720px; }
  .hero img { display: block; width: 1440px; height: 720px; object-fit: cover; }
  .hero-copy { position: absolute; left: 120px; top: 240px; width: 900px; }
  .hero h1 { margin: 0; font-size: 72px; line-height: 1.3; color: #fff; }
  .hero p { margin: 24px 0 0; width: 800px; font-size: 26px; line-height: 1.5; color: #e2e8f0; }
  .cards { height: 480px; box-sizing: border-box; padding: 120px 120px 0; display: flex; gap: 80px; }
  .card { width: 560px; height: 360px; box-sizing: border-box; padding: 40px; border-radius: 24px; background: #f1f5f9; }
  .card h2 { margin: 0; font-size: 36px; }
  .card p { margin: 16px 0 0; font-size: 22px; line-height: 1.6; color: #475569; }
  .about { height: 920px; box-sizing: border-box; padding: 120px; display: flex; gap: 40px; align-items: flex-start; }
  .about img { width: 160px; height: 160px; }
  .about p { margin: 0; width: 1000px; font-size: 28px; line-height: 1.6; }
  footer { height: 200px; box-sizing: border-box; padding: 80px 120px; background: #0f172a; color: #94a3b8; font-size: 22px; }
</style>
</head>
<body>
  <nav data-vw-id="nav" data-vw-origin="header &gt; nav">
    <span class="brand" data-vw-id="brand" data-vw="text color">示例网页</span>
    <a href="#" data-vw-id="navProduct" data-vw="text color">产品</a>
    <a href="#" data-vw-id="navCases" data-vw="text color">案例</a>
    <a href="#" data-vw-id="navContact" data-vw="text color">联系我们</a>
  </nav>
  <section class="hero">
    <img data-vw-id="hero" data-vw="move resize crop" data-vw-origin="main &gt; section.hero img" src="../assets/photo-city.png" alt="城市照片">
    <div class="hero-copy">
      <h1 data-vw-id="title" data-vw="text move color" data-vw-origin="main &gt; section.hero h1">把想法排成<b>网页</b></h1>
      <p data-vw-id="sub" data-vw="text move color" data-vw-origin="main &gt; section.hero p">电脑端 1440 宽，整页 2400 高，在 1440×900 的窗口里滚动浏览。</p>
    </div>
  </section>
  <section class="cards">
    <article class="card" data-vw-id="card1" data-vw="move resize background">
      <h2 data-vw-id="card1Title" data-vw="text color">第一部分</h2>
      <p data-vw-id="card1Text" data-vw="text color">卡片的底色、标题和说明都可以在工作台里改。</p>
    </article>
    <article class="card" data-vw-id="card2" data-vw="move resize background">
      <h2 data-vw-id="card2Title" data-vw="text color">第二部分</h2>
      <p data-vw-id="card2Text" data-vw="text color">改动记进修改单，交接包里按原网页定位列出来。</p>
    </article>
  </section>
  <section class="about">
    <img data-vw-id="logo" data-vw="move resize" src="../assets/logo.png" alt="标志">
    <p data-vw-id="body" data-vw="text color">这一段文字说明网页项目的页面可以比窗口长得多，导出图片时按<span style="color:#2563eb">整页高度</span>一次截完。</p>
  </section>
  <footer data-vw-id="footer" data-vw="background" data-vw-origin="footer">
    <span data-vw-id="footerText" data-vw="text color">© 示例网页 · 视觉工作台</span>
  </footer>
</body>
</html>

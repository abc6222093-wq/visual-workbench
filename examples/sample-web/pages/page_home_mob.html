<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>首页 · 手机端</title>
<style>
  html, body { margin: 0; width: 390px; }
  body { background: #fff; color: #0f172a; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
  nav { height: 64px; box-sizing: border-box; padding: 0 24px; display: flex; align-items: center; gap: 16px; background: #0f172a; color: #fff; }
  nav .brand { margin-right: auto; font-size: 20px; font-weight: 700; }
  nav a { color: inherit; text-decoration: none; font-size: 15px; }
  .hero { position: relative; height: 520px; }
  .hero img { display: block; width: 390px; height: 520px; object-fit: cover; }
  .hero-copy { position: absolute; left: 24px; top: 176px; width: 342px; }
  .hero h1 { margin: 0; font-size: 40px; line-height: 1.25; color: #fff; }
  .hero p { margin: 16px 0 0; font-size: 18px; line-height: 1.6; color: #e2e8f0; }
  .cards { height: 756px; box-sizing: border-box; padding: 56px 24px 0; display: grid; gap: 40px; align-content: start; }
  .card { height: 300px; box-sizing: border-box; padding: 32px 24px; border-radius: 20px; background: #f1f5f9; }
  .card h2 { margin: 0; font-size: 28px; }
  .card p { margin: 12px 0 0; font-size: 17px; line-height: 1.6; color: #475569; }
  .about { height: 1460px; box-sizing: border-box; padding: 0 24px; }
  .about img { width: 120px; height: 120px; }
  .about p { margin: 40px 0 0; font-size: 20px; line-height: 1.7; }
  footer { height: 200px; box-sizing: border-box; padding: 80px 24px; background: #0f172a; color: #94a3b8; font-size: 16px; }
</style>
</head>
<body>
  <nav data-vw-id="nav" data-vw-origin="header &gt; nav">
    <span class="brand" data-vw-id="brand" data-vw="text color">示例网页</span>
    <a href="#" data-vw-id="navProduct" data-vw="text color">产品</a>
    <a href="#" data-vw-id="navContact" data-vw="text color">联系我们</a>
  </nav>
  <section class="hero">
    <img data-vw-id="hero" data-vw="move resize crop" data-vw-origin="main &gt; section.hero img" src="../assets/photo-city.png" alt="城市照片">
    <div class="hero-copy">
      <h1 data-vw-id="title" data-vw="text move color" data-vw-origin="main &gt; section.hero h1">把想法排成<b>网页</b></h1>
      <p data-vw-id="sub" data-vw="text move color" data-vw-origin="main &gt; section.hero p">手机端 390 宽，整页 3000 高。</p>
    </div>
  </section>
  <section class="cards">
    <article class="card" data-vw-id="card1" data-vw="move resize background">
      <h2 data-vw-id="card1Title" data-vw="text color">第一部分</h2>
      <p data-vw-id="card1Text" data-vw="text color">卡片的底色、标题和说明都可以在工作台里改。</p>
    </article>
    <article class="card" data-vw-id="card2" data-vw="move resize background">
      <h2 data-vw-id="card2Title" data-vw="text color">第二部分</h2>
      <p data-vw-id="card2Text" data-vw="text color">改动记进修改单，交接包里按原网页定位列出来。</p>
    </article>
  </section>
  <section class="about">
    <img data-vw-id="logo" data-vw="move resize" src="../assets/logo.png" alt="标志">
    <p data-vw-id="body" data-vw="text color">这一段文字说明网页项目的页面可以比窗口长得多，导出图片时按<span style="color:#2563eb">整页高度</span>一次截完。</p>
  </section>
  <footer data-vw-id="footer" data-vw="background" data-vw-origin="footer">
    <span data-vw-id="footerText" data-vw="text color">© 示例网页 · 视觉工作台</span>
  </footer>
</body>
</html>
